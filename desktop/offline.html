<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Overvibe</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #191920; color: #ececef; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
      .card { max-width: 420px; text-align: center; padding: 32px; }
      .glyph { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 11px; background: #6d5ef6; display: grid; place-items: center; color: #fff; font: 600 18px ui-monospace, Menlo, monospace; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { color: #9b9ba3; margin: 0 0 20px; }
      code { font: 12.5px ui-monospace, Menlo, monospace; color: #c8c8cf; }
      button { font: inherit; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
      .brand { background: #6d5ef6; color: #fff; font-weight: 500; }
      .ghost { background: transparent; color: #9b9ba3; margin-left: 6px; }
      button:disabled { opacity: 0.6; cursor: default; }
      #msg { min-height: 20px; margin-top: 14px; color: #9b9ba3; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glyph">&gt;_</div>
      <h1>Overvibe isn't running</h1>
      <p>Nothing answers on <code>127.0.0.1:7777</code>. Start starts the server from the repo, and the window opens Overvibe once it answers. It keeps running after you quit this app.</p>
      <button id="start" class="brand">Start</button>
      <button id="retry" class="ghost">Try again</button>
      <div id="msg"></div>
    </div>
    <script>
      const msg = document.getElementById('msg')
      const start = document.getElementById('start')
      const retry = document.getElementById('retry')
      start.onclick = async () => {
        start.disabled = retry.disabled = true
        msg.textContent = 'Starting the server…'
        const ok = await window.deckDesktop.start()
        if (!ok) msg.textContent = 'It did not answer within 30 seconds. See server.log in ~/.config/overvibe/logs (or the logDir in config.json).'
        start.disabled = retry.disabled = false
      }
      retry.onclick = async () => {
        msg.textContent = 'Checking…'
        if (!(await window.deckDesktop.retry())) msg.textContent = 'Still not answering.'
      }
    </script>
  </body>
</html>
